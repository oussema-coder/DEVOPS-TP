<div class="page-header">
  <h1><span class="icon">🛏️</span> Chambres</h1>
  <button id="btn-add-chambre" class="btn btn-primary" (click)="openAdd()">+ Ajouter</button>
</div>

<div *ngIf="success" class="alert alert-success">{{ success }}</div>
<div *ngIf="error"   class="alert alert-error">{{ error }}</div>
<div *ngIf="loading" class="spinner-wrap"><div class="spinner"></div></div>

<ng-container *ngIf="!loading">
  <div *ngIf="items.length === 0" class="empty-state">
    <div class="empty-icon">🛏️</div>
    <p>Aucune chambre trouvée.</p>
    <button class="btn btn-primary mt-2" (click)="openAdd()">Ajouter la première</button>
  </div>

  <div *ngIf="items.length > 0" class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Numéro</th>
          <th>Type</th>
          <th>Bloc</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of items">
          <td><span class="badge badge-teal">#{{ c.idChambre }}</span></td>
          <td><strong>{{ c.numeroChambre }}</strong></td>
          <td><span class="badge" [ngClass]="typeBadgeClass(c.typeChambre)">{{ c.typeChambre }}</span></td>
          <td>{{ c.bloc?.nomBloc || '—' }}</td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-secondary" (click)="openEdit(c)">✏️ Modifier</button>
            <button class="btn btn-sm btn-danger"    (click)="delete(c.idChambre!)">🗑️ Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>

<div class="modal-overlay" *ngIf="showModal" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editMode ? 'Modifier' : 'Ajouter' }} une Chambre</h2>
      <button class="btn-icon" (click)="close()">✕</button>
    </div>
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label for="numeroChambre">Numéro de chambre</label>
        <input id="numeroChambre" class="form-control" type="number"
               [(ngModel)]="current.numeroChambre" name="numeroChambre"
               placeholder="ex: 101" min="1" required>
      </div>
      <div class="form-group">
        <label for="typeChambre">Type</label>
        <select id="typeChambre" class="form-control"
                [(ngModel)]="current.typeChambre" name="typeChambre" required>
          <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close()">Annuler</button>
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Mettre à jour' : 'Ajouter' }}</button>
      </div>
    </form>
  </div>
</div>
