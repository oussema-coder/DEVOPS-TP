<div class="dashboard-wrap">
  <div class="dashboard-header">
    <h1>🏨 Tableau de bord</h1>
    <p class="text-muted">Gestion du Foyer Universitaire — tpFoyer17</p>
  </div>

  <div *ngIf="loading" class="spinner-wrap"><div class="spinner"></div></div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div *ngIf="!loading && !error" class="stats-grid">
    <a *ngFor="let s of stats" [routerLink]="s.route" class="stat-card" [style.--card-accent]="s.color">
      <div class="stat-icon">{{ s.icon }}</div>
      <div class="stat-count">{{ s.count }}</div>
      <div class="stat-label">{{ s.label }}</div>
      <div class="stat-arrow">→</div>
    </a>
  </div>

  <div class="info-banner">
    <span class="info-icon">ℹ️</span>
    <span>Utilisez la barre de navigation pour accéder et gérer chaque entité.</span>
  </div>
</div>
