<div class="page-header">
  <h1><span class="icon">🎓</span> Universités</h1>
  <button id="btn-add-universite" class="btn btn-primary" (click)="openAdd()">+ Ajouter</button>
</div>

<div *ngIf="success" class="alert alert-success">{{ success }}</div>
<div *ngIf="error"   class="alert alert-error">{{ error }}</div>

<div *ngIf="loading" class="spinner-wrap"><div class="spinner"></div></div>

<ng-container *ngIf="!loading">
  <div *ngIf="items.length === 0" class="empty-state">
    <div class="empty-icon">🎓</div>
    <p>Aucune université trouvée.</p>
    <button class="btn btn-primary mt-2" (click)="openAdd()">Ajouter la première</button>
  </div>

  <div *ngIf="items.length > 0" class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Adresse</th>
          <th>Foyer</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of items">
          <td><span class="badge badge-teal">#{{ u.idUniversite }}</span></td>
          <td><strong>{{ u.nomUniversite }}</strong></td>
          <td>{{ u.adresse }}</td>
          <td>
            <span *ngIf="u.foyer" class="badge badge-success">{{ u.foyer.nomFoyer }}</span>
            <span *ngIf="!u.foyer" class="badge badge-warning">Non assigné</span>
          </td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-secondary" (click)="openEdit(u)">✏️ Modifier</button>
            <button class="btn btn-sm btn-danger"    (click)="delete(u.idUniversite!)">🗑️ Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editMode ? 'Modifier' : 'Ajouter' }} une Université</h2>
      <button class="btn-icon" (click)="close()">✕</button>
    </div>
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label for="nomUniversite">Nom de l'université</label>
        <input id="nomUniversite" class="form-control" type="text"
               [(ngModel)]="current.nomUniversite" name="nomUniversite"
               placeholder="ex: ESPRIT" required>
      </div>
      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input id="adresse" class="form-control" type="text"
               [(ngModel)]="current.adresse" name="adresse"
               placeholder="ex: Tunis, Tunisie" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close()">Annuler</button>
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Mettre à jour' : 'Ajouter' }}</button>
      </div>
    </form>
  </div>
</div>
