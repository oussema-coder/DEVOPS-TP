<div class="page-header">
  <h1><span class="icon">🧱</span> Blocs</h1>
  <button id="btn-add-bloc" class="btn btn-primary" (click)="openAdd()">+ Ajouter</button>
</div>

<div *ngIf="success" class="alert alert-success">{{ success }}</div>
<div *ngIf="error"   class="alert alert-error">{{ error }}</div>
<div *ngIf="loading" class="spinner-wrap"><div class="spinner"></div></div>

<ng-container *ngIf="!loading">
  <div *ngIf="items.length === 0" class="empty-state">
    <div class="empty-icon">🧱</div>
    <p>Aucun bloc trouvé.</p>
    <button class="btn btn-primary mt-2" (click)="openAdd()">Ajouter le premier</button>
  </div>

  <div *ngIf="items.length > 0" class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Capacité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of items">
          <td><span class="badge badge-teal">#{{ b.idBloc }}</span></td>
          <td><strong>{{ b.nomBloc }}</strong></td>
          <td>{{ b.capaciteBloc }} chambres</td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-secondary" (click)="openEdit(b)">✏️ Modifier</button>
            <button class="btn btn-sm btn-danger"    (click)="delete(b.idBloc!)">🗑️ Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>

<div class="modal-overlay" *ngIf="showModal" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editMode ? 'Modifier' : 'Ajouter' }} un Bloc</h2>
      <button class="btn-icon" (click)="close()">✕</button>
    </div>
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label for="nomBloc">Nom du bloc</label>
        <input id="nomBloc" class="form-control" type="text"
               [(ngModel)]="current.nomBloc" name="nomBloc"
               placeholder="ex: Bloc A" required>
      </div>
      <div class="form-group">
        <label for="capaciteBloc">Capacité</label>
        <input id="capaciteBloc" class="form-control" type="number"
               [(ngModel)]="current.capaciteBloc" name="capaciteBloc"
               placeholder="ex: 50" min="1" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close()">Annuler</button>
        <button type="submit" class="btn btn-primary">{{ editMode ? 'Mettre à jour' : 'Ajouter' }}</button>
      </div>
    </form>
  </div>
</div>
